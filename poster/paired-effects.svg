  <text x="192.0" y="604.5" text-anchor="end" class="label">train_4</text>
  <line x1="220.0" y1="665.0" x2="1110.0" y2="665.0" stroke="#c8d2dc" stroke-width="1"/>
  <line x1="815.6" y1="580.5" x2="1027.2" y2="580.5" stroke="#2e7d32" stroke-width="5"/>
