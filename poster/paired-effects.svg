  <line x1="315" y1="710" x2="365" y2="710" stroke="#2e7d32" stroke-width="5"/>
  <circle cx="340" cy="710" r="8" fill="#2e7d32"/>
  <text x="380.0" y="717.0" text-anchor="start" class="label">Single-turn mean and 95% CI</text>
  <rect x="705" y="702" width="16" height="16" fill="#b04020"/>
