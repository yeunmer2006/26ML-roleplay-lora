# LoRA 配置 - 快速测试（1 epoch）
# RTX 4060 8GB，约 5-10 分钟
# 用于验证流程，验证通过后再跑完整训练

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 256
  use_4bit_quantization: true

lora:
  r: 8
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./output/lora_roleplay"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  evaluation_strategy: "steps"
  save_total_limit: 2
  fp16: true
  optim: "paged_adamw_8bit"
  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  greater_is_better: false

data:
  dataset_name: "KaraKaraWitch/PIPPA-ShareGPT-formatted"
  test_size: 0.1
  seed: 42

inference:
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
