# LoRA 配置 - 角色扮演对话生成
# 基于 Qwen2.5-3B-Instruct

# 模型配置
model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 1024            # RTX 4060 8GB 降低序列长度
  use_4bit_quantization: true    # 必须启用 4-bit 量化

# LoRA 配置
lora:
  r: 16                       # Rank，低秩矩阵维度
  lora_alpha: 32              # 缩放因子，通常为 r 的 2 倍
  target_modules:
    - "q_proj"               # Query 投影
    - "k_proj"               # Key 投影
    - "v_proj"               # Value 投影
    - "o_proj"               # Output 投影
  lora_dropout: 0.05          # Dropout 概率
  bias: "none"                # 不训练 bias
  task_type: "CAUSAL_LM"     # 因果语言模型

# 训练配置
training:
  output_dir: "./output/lora_roleplay"
  num_train_epochs: 3
  per_device_train_batch_size: 1    # RTX 4060 8GB 用 batch=1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16   # 总 batch = 16
  gradient_checkpointing: true      # 开启梯度检查点省显存
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  evaluation_strategy: "steps"
  save_total_limit: 3
  fp16: true
  optim: "paged_adamw_8bit"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

# 数据配置
data:
  dataset_name: "PIPPA-ShareGPT"
  test_size: 0.1
  seed: 42

# 推理配置
inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
