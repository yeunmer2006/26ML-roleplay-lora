# 上下文消融：在 train_2 基础上仅将上下文长度增加到 1024
model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 1024
  use_4bit_quantization: true
  bnb_compute_dtype: "float16"

lora:
  r: 8
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "output/experiments/train_3"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 250
  save_strategy: "steps"
  eval_strategy: "epoch"
  save_total_limit: 2
  fp16: true
  bf16: false
  optim: "paged_adamw_8bit"
  dataloader_num_workers: 2

data:
  data_dir: "processed"
  dataset_name: "KaraKaraWitch/PIPPA-ShareGPT-formatted"
  max_train_samples: 4000
  max_eval_samples: 200
  seed: 42
