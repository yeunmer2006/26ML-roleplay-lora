# 第六次实验：在 train_5 基线上改用 assistant turn 多轮窗口训练
model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 1024
  use_4bit_quantization: true
  bnb_compute_dtype: "float16"

lora:
  r: 8
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "output/experiments/train_6"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: true
  bf16: false
  optim: "paged_adamw_8bit"
  dataloader_num_workers: 2

data:
  data_dir: "processed_clean"
  dataset_name: "KaraKaraWitch/PIPPA-ShareGPT-formatted"
  max_train_samples: 2500
  max_eval_samples: 120
  sample_strategy: "assistant_windows"
  max_windows_per_conversation: 3
  seed: 42
