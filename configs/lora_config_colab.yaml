# LoRA 配置 - Colab T4 GPU 训练
# 基于 Qwen2.5-3B-Instruct

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 2048
  use_4bit_quantization: true  # 仍然开启，训练更快

lora:
  r: 32                      # Colab 可以用更高的 rank
  lora_alpha: 64
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./output/lora_roleplay"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  evaluation_strategy: "steps"
  save_total_limit: 3
  fp16: true
  optim: "paged_adamw_8bit"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

data:
  dataset_name: "KaraKaraWitch/PIPPA-ShareGPT-formatted"
  test_size: 0.1
  seed: 42

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
