# LoRA 配置 - Colab T4 GPU 训练
# 基于 Qwen2.5-3B-Instruct

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 1024            # 与本地配置一致
  use_4bit_quantization: true

lora:
  r: 16                       # Rank，低秩矩阵维度
  lora_alpha: 32              # 缩放因子，通常为 r 的 2 倍
  target_modules:
    - "q_proj"               # Query 投影
    - "k_proj"               # Key 投影
    - "v_proj"               # Value 投影
    - "o_proj"               # Output 投影
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./output/lora_roleplay"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16   # 总 batch = 16
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  evaluation_strategy: "steps"
  save_total_limit: 3
  fp16: true
  optim: "paged_adamw_8bit"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

data:
  dataset_name: "KaraKaraWitch/PIPPA-ShareGPT-formatted"
  val_size: 0.1
  test_size: 0.1
  seed: 42

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
